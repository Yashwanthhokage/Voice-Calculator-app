<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="top-nav">
  <span class="nav-title">Calculator</span>
  <div class="nav-tabs">
    <button class="tab-btn active" id="calcTabBtn">Calculator</button>
    <button class="tab-btn" id="convTabBtn">Converter</button>
  </div>
</div>
  <main class="app">
      <header class="app-header">
        <button id="themeToggle" aria-label="Toggle Dark/Light Mode">🌓</button>
</header>

    <section class="display" aria-live="polite">
      <input id="screen" type="text" aria-label="Calculator display" readonly>
    </section>
    <div class="history-container">
  <div class="history-header">
    <span>History</span>
    <button id="clearHistory">Clear</button>
  </div>
  <ul id="historyList"></ul>
    </div>
    <!-- CURRENCY CONVERTER SECTION -->
<div class="currency-section">
  <h3 class="currency-title">💱 Currency Converter</h3>
  
  <div class="currency-inputs">
    <!-- Amount Input -->
    <div class="input-group">
      <label for="currencyAmount">Amount:</label>
      <input type="number" id="currencyAmount" placeholder="100" value="1">
    </div>
    
    <!-- From Currency -->
    <div class="input-group">
      <label for="fromCurrency">From:</label>
      <select id="fromCurrency">
        <option value="USD" selected>USD - US Dollar</option>
        <option value="INR">INR - Indian Rupee</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="JPY">JPY - Japanese Yen</option>
        <option value="AUD">AUD - Australian Dollar</option>
        <option value="CAD">CAD - Canadian Dollar</option>
        <option value="CNY">CNY - Chinese Yuan</option>
      </select>
    </div>
    
    <!-- Swap Button -->
    <button id="swapBtn" class="swap-btn">⇄</button>
    
    <!-- To Currency -->
    <div class="input-group">
      <label for="toCurrency">To:</label>
      <select id="toCurrency">
        <option value="USD">USD - US Dollar</option>
        <option value="INR" selected>INR - Indian Rupee</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="JPY">JPY - Japanese Yen</option>
        <option value="AUD">AUD - Australian Dollar</option>
        <option value="CAD">CAD - Canadian Dollar</option>
        <option value="CNY">CNY - Chinese Yuan</option>
      </select>
    </div>
  </div>
  
  <!-- Convert Button -->
  <button id="convertBtn" class="convert-btn">Convert</button>
  
  <!-- Result Display -->
  <div id="currencyResult" class="currency-result">
    <p id="currencyResultText">Enter amount and click Convert</p>
  </div>
  
  <!-- Rate Update Status -->
  <div id="rateStatus" class="rate-status">Loading exchange rates...</div>
</div>

<div class="controls">
  <button id="micBtn">🎤</button>
  <button id="backspaceBtn">⌫</button>
  <button id="clearBtn">C</button>
</div>
    <section class="keypad">
  <button class="calc-btn">7</button>
  <button class="calc-btn">8</button>
  <button class="calc-btn">9</button>
  <button class="calc-btn">/</button>

  <button class="calc-btn">4</button>
  <button class="calc-btn">5</button>
  <button class="calc-btn">6</button>
  <button class="calc-btn">*</button>

  <button class="calc-btn">1</button>
  <button class="calc-btn">2</button>
  <button class="calc-btn">3</button>
  <button class="calc-btn">-</button>

  <button class="calc-btn">0</button>
  <button class="calc-btn">.</button>
  <button class="calc-btn">=</button>
  <button class="calc-btn">+</button>
    </section>

    <section class="scientific">
  <button class="calc-btn">sin</button>
  <button class="calc-btn">cos</button>
  <button class="calc-btn">tan</button>
  <button class="calc-btn">log</button>
  <button class="calc-btn">√</button>
  <button class="calc-btn">^</button>
  <button class="calc-btn">exp</button>
    </section>

  <script src="app.js"></script>
</body>
</html>
